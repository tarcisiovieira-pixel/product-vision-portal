# Blueprint do Render — só a API. O front é publicado pelo Lovable.
services:
  - type: web
    name: ares-api
    runtime: node
    rootDir: backend
    # NODE_ENV=production faz o npm omitir devDependencies; o build precisa do typescript.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY_HOPS
        value: "1" # o Render coloca 1 proxy na frente da API
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # URL(s) do front no Lovable, separadas por vírgula
