# Blueprint do Render — só a API. O front é publicado pelo Lovable.
services:
  - type: web
    name: ares-api
    runtime: node
    plan: free # sem custo; dorme após 15 min sem uso e acorda em ~1 min
    rootDir: backend
    # NODE_ENV=production faz o npm omitir devDependencies; o build precisa do typescript.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # A API compila a pasta shared/ (fora do rootDir): mudanças nela também geram deploy.
    buildFilter:
      paths:
        - backend/**
        - shared/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY_HOPS
        value: "1" # o Render coloca 1 proxy na frente da API
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # URL(s) do front no Lovable, separadas por vírgula
      # IA generativa (opcional). Sem chave, as IAs seguem no motor de regras.
      # Gemini tem camada gratuita (chave em aistudio.google.com/apikey).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite # rode `npm run ai:check` na pasta backend para ver os modelos da sua chave
      - key: ANTHROPIC_API_KEY
        sync: false # alternativa paga; se as duas existirem, o Gemini vence (ou defina AI_PROVIDER)
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: AI_DAILY_LIMIT
        value: "30" # chamadas ao modelo por usuário, por dia e por tipo de IA
